# The application's own tests only check that the context starts, so they run against an
# in-memory database: a build must never touch the developer's data/ directory.
spring:
  datasource:
    url: jdbc:h2:mem:financial-tracker-test;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
