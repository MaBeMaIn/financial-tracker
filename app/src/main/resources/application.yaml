spring:
  application:
    name: financial-tracker

  datasource:
    url: jdbc:h2:mem:financial-tracker;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

  jpa:
    # Flyway owns the schema; Hibernate only checks that the mapping still fits it.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  h2:
    console:
      enabled: true
