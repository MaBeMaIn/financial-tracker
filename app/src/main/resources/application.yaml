spring:
  application:
    name: financial-tracker

  datasource:
    # A file, not memory: the data outlives the process, and there is nothing to host or pay
    # for. The path is relative to the working directory, and data/ is not in version control.
    url: jdbc:h2:file:./data/financial-tracker
    username: sa
    password: ""

  jpa:
    # Flyway owns the schema; Hibernate only checks that the mapping still fits it.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  h2:
    console:
      enabled: true
